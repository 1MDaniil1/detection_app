services:
  postgres:
    image: postgres:15-alpine  
    container_name: detection-db
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine  
    container_name: detection-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: detection-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: detection-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/mydatabase
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000

  celery-worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: detection-celery-worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/mydatabase
      - REDIS_URL=redis://redis:6379/0
    command: celery -A celery_worker.celery worker --loglevel=info

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: detection-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000

volumes:
  postgres-data:
  minio-data: